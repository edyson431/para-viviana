
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>💖 Para Viviana</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Georgia', serif;
    background: #0a0a0a;
    color: #fff;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    position: relative;
  }

  /* ===== PANTALLA DE ACCESO ===== */
  #acceso {
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    padding: 45px 30px;
    border-radius: 20px;
    box-shadow: 0 10px 60px rgba(233, 30, 99, 0.4);
    border: 1px solid rgba(255, 107, 157, 0.3);
    max-width: 400px;
    width: 88%;
    z-index: 10;
  }
  #acceso h1 {
    font-size: 22px;
    margin-bottom: 10px;
    color: #ff6b9d;
    letter-spacing: 2px;
  }
  #acceso p {
    font-size: 13px;
    margin-bottom: 22px;
    color: #aaa;
  }
  input {
    width: 100%;
    padding: 14px;
    border: 2px solid #ff6b9d;
    background: transparent;
    border-radius: 10px;
    font-size: 16px;
    text-align: center;
    color: #fff;
    outline: none;
    margin-bottom: 18px;
    letter-spacing: 3px;
  }
  input::placeholder { color: #666; letter-spacing: 1px; }
  button {
    background: linear-gradient(135deg, #ff6b9d, #c44569);
    color: white;
    border: none;
    padding: 14px 40px;
    border-radius: 10px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.3s;
    letter-spacing: 2px;
    font-family: inherit;
  }
  button:hover { transform: scale(1.05); box-shadow: 0 0 30px #ff6b9d; }
  #error {
    color: #ff5555;
    font-size: 13px;
    margin-top: 15px;
    display: none;
  }

  /* ===== EXPERIENCIA ===== */
  #experiencia {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
    overflow: hidden;
    padding: 20px;
  }

  .linea {
    font-size: 52px;
    font-weight: bold;
    color: #ff6b9d;
    letter-spacing: 12px;
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 1.5s ease, transform 1.5s ease;
    text-shadow: 0 0 30px rgba(255, 107, 157, 0.8);
    margin: 10px 0;
    z-index: 6;
    position: relative;
  }
  .linea.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .final {
    font-size: 18px;
    color: #fff;
    letter-spacing: 4px;
    font-style: italic;
    margin-top: 30px;
  }

  /* ===== FOTOS (Escritorio) ===== */
  .foto {
    position: absolute;
    width: 160px;
    height: 200px;
    object-fit: cover;
    border-radius: 15px;
    border: 3px solid #ff6b9d;
    box-shadow: 0 0 30px rgba(255, 107, 157, 0.6);
    opacity: 0;
    transition: opacity 2s ease, transform 2s ease;
    transform: scale(0.8);
    z-index: 4;
  }
  .foto.visible {
    opacity: 1;
    transform: scale(1);
  }
  #f1 { top: 8%; left: 4%; animation: flotar 4s ease-in-out infinite; }
  #f2 { top: 12%; right: 4%; animation: flotar 5s ease-in-out infinite; }
  #f3 { bottom: 8%; left: 5%; animation: flotar 4.5s ease-in-out infinite; }
  #f4 { bottom: 10%; right: 5%; animation: flotar 5.5s ease-in-out infinite; }

  @keyframes flotar {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-12px) scale(1.03); }
  }

  /* Botón repetir */
  #repetir {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255, 107, 157, 0.2);
    border: 1px solid #ff6b9d;
    color: #ff6b9d;
    padding: 10px 22px;
    border-radius: 25px;
    font-size: 13px;
    cursor: pointer;
    display: none;
    letter-spacing: 2px;
    font-family: inherit;
    transition: 0.3s;
    z-index: 20;
  }
  #repetir:hover { background: #ff6b9d; color: #fff; }

  /* Corazones flotantes */
  .corazon-flotante {
    position: fixed;
    font-size: 24px;
    animation: flotarC 6s linear infinite;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes flotarC {
    0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
  }

  /* Nombre inicial */
  #nombreInicial {
    font-size: 38px;
    color: #ff6b9d;
    letter-spacing: 6px;
    opacity: 0;
    transition: opacity 2s ease;
    margin-bottom: 40px;
    font-weight: bold;
    z-index: 10;
    position: relative;
  }
  #nombreInicial.visible { opacity: 1; }

  /* ============================================ */
  /* 📱 RESPONSIVE - CELULAR VERTICAL             */
  /* ============================================ */
  @media (max-width: 600px) and (orientation: portrait) {
    #acceso {
      padding: 35px 22px;
      max-width: 88%;
    }
    #acceso h1 { font-size: 19px; }
    #acceso p { font-size: 12px; }
    input { padding: 12px; font-size: 15px; }
    button { padding: 12px 30px; font-size: 14px; }

    .linea {
      font-size: 34px;
      letter-spacing: 6px;
      margin: 8px 0;
    }
    .final {
      font-size: 14px;
      letter-spacing: 3px;
      margin-top: 20px;
    }

    /* Fotos más pequeñas y pegadas a las esquinas */
    .foto {
      width: 95px;
      height: 120px;
      border-width: 2px;
      border-radius: 10px;
    }
    #f1 { top: 5%; left: 3%; }
    #f2 { top: 5%; right: 3%; }
    #f3 { bottom: 5%; left: 3%; }
    #f4 { bottom: 5%; right: 3%; }

    #nombreInicial {
      font-size: 28px;
      letter-spacing: 5px;
      margin-bottom: 30px;
    }

    #repetir {
      font-size: 12px;
      padding: 9px 18px;
      bottom: 12px;
    }

    .corazon-flotante { font-size: 20px; }
  }

  /* 📱 Celular pero en HORIZONTAL (acostado) */
  @media (max-width: 900px) and (orientation: landscape) {
    .linea { font-size: 32px; letter-spacing: 6px; }
    .final { font-size: 14px; }
    .foto { width: 90px; height: 115px; }
    #nombreInicial { font-size: 26px; }
  }

  /* 📱 Celulares muy pequeños (iPhone SE, etc.) */
  @media (max-width: 380px) {
    .linea { font-size: 28px; letter-spacing: 4px; }
    .foto { width: 80px; height: 100px; }
    #nombreInicial { font-size: 24px; }
  }
</style>
</head>
<body>

<!-- ===== ACCESO ===== -->
<div id="acceso">
  <h1>💌 Solo para ti, Viviana</h1>
  <p>Ingresa la palabra secreta</p>
  <input type="password" id="clave" placeholder="• • • • • • • •">
  <br>
  <button onclick="verificar()">Entrar</button>
  <p id="error">❌ Esta web es solo para Viviana 💖</p>
</div>

<!-- ===== EXPERIENCIA ===== -->
<div id="experiencia">
  <img class="foto" id="f1" src="fotos/foto1.jpg" alt="">
  <img class="foto" id="f2" src="fotos/foto2.jpg" alt="">
  <img class="foto" id="f3" src="fotos/foto3.jpg" alt="">
  <img class="foto" id="f4" src="fotos/foto4.jpg" alt="">

  <div id="nombreInicial">VIVIANA</div>
  <div class="linea" id="l1">TE</div>
  <div class="linea" id="l2">AMO</div>
  <div class="linea" id="l3">VIVIANA</div>
  <div class="linea final" id="l4">Con todo mi corazón 💖</div>
</div>

<button id="repetir" onclick="reiniciar()">🔁 Ver de nuevo</button>

<!-- 🎵 TU CANCIÓN -->
<audio id="musica" loop>
  <source src="cancion.mp3" type="audio/mpeg">
</audio>

<script>
  const CONTRASENA = "vivi2023";

  const TIEMPOS = {
    nombre: 1000,
    foto1: 2500,
    foto2: 4000,
    l1: 6000,
    foto3: 7500,
    l2: 9000,
    foto4: 10500,
    l3: 12000,
    l4: 16000,
    repetir: 20000
  };

  function verificar() {
    const input = document.getElementById('clave').value.toLowerCase().trim();
    if (input === CONTRASENA) {
      document.getElementById('acceso').style.display = 'none';
      document.getElementById('experiencia').style.display = 'flex';
      iniciarExperiencia();
    } else {
      document.getElementById('error').style.display = 'block';
    }
  }

  document.getElementById('clave').addEventListener('keypress', e => {
    if (e.key === 'Enter') verificar();
  });

  let timeouts = [];

  function iniciarExperiencia() {
    const musica = document.getElementById('musica');
    musica.currentTime = 0;
    musica.play().catch(err => console.log('Autoplay bloqueado'));

    timeouts.push(setTimeout(() => document.getElementById('nombreInicial').classList.add('visible'), TIEMPOS.nombre));
    timeouts.push(setTimeout(() => document.getElementById('f1').classList.add('visible'), TIEMPOS.foto1));
    timeouts.push(setTimeout(() => document.getElementById('f2').classList.add('visible'), TIEMPOS.foto2));
    timeouts.push(setTimeout(() => {
      document.getElementById('nombreInicial').style.display = 'none';
      document.getElementById('l1').classList.add('visible');
    }, TIEMPOS.l1));
    timeouts.push(setTimeout(() => document.getElementById('f3').classList.add('visible'), TIEMPOS.foto3));
    timeouts.push(setTimeout(() => document.getElementById('l2').classList.add('visible'), TIEMPOS.l2));
    timeouts.push(setTimeout(() => document.getElementById('f4').classList.add('visible'), TIEMPOS.foto4));
    timeouts.push(setTimeout(() => document.getElementById('l3').classList.add('visible'), TIEMPOS.l3));
    timeouts.push(setTimeout(() => {
      document.getElementById('l4').classList.add('visible');
      lanzarCorazones();
    }, TIEMPOS.l4));
    timeouts.push(setTimeout(() => document.getElementById('repetir').style.display = 'block', TIEMPOS.repetir));
  }

  function reiniciar() {
    timeouts.forEach(t => clearTimeout(t));
    timeouts = [];

    document.getElementById('nombreInicial').style.display = 'block';
    document.getElementById('nombreInicial').classList.remove('visible');
    ['l1','l2','l3','l4','f1','f2','f3','f4'].forEach(id => {
      document.getElementById(id).classList.remove('visible');
    });
    document.getElementById('repetir').style.display = 'none';

    const musica = document.getElementById('musica');
    musica.currentTime = 0;

    setTimeout(iniciarExperiencia, 500);
  }

  function lanzarCorazones() {
    const emojis = ['❤️','💖','💘','💕','💗','💓','💞','💝','🌹','🌷','💐'];
    setInterval(() => {
      const c = document.createElement('div');
      c.className = 'corazon-flotante';
      c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      c.style.left = Math.random() * 100 + 'vw';
      c.style.animationDuration = (5 + Math.random() * 3) + 's';
      document.body.appendChild(c);
      setTimeout(() => c.remove(), 8000);
    }, 400);
  }
</script>
</body>
</html>
